<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominion Kingdom Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- Sidebar: controls -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <h2>Sets</h2>
        <div id="set-checkboxes"></div>
      </div>

      <div class="sidebar-section">
        <h2>Options</h2>
        <div class="control-row">
          <label for="players">Number of players</label>
          <input type="number" id="players" min="2" max="6" value="2">
        </div>
        <div class="control-row">
          <label for="max-sets">Max sets to draw from</label>
          <input type="number" id="max-sets" min="1" max="1" value="1">
        </div>
        <div class="control-row">
          <label for="min-per-set">Min cards per set</label>
          <input type="number" id="min-per-set" min="1" max="10" value="1">
        </div>
        <label class="set-checkbox">
          <input type="checkbox" id="village-check">
          <span>+2 Action Required</span>
        </label>
      </div>

      <div class="sidebar-section">
        <h2>Player Names</h2>
        <div id="player-names"></div>
      </div>

      <div class="sidebar-section">
        <h2>Veto</h2>
        <div class="control-row">
          <label for="veto-count">Cards to veto</label>
          <input type="number" id="veto-count" min="0" value="0">
        </div>
        <div id="veto-warning" class="warning" hidden></div>
      </div>

      <div id="constraint-warning" class="warning" hidden></div>
      <div id="error-msg" class="error" hidden></div>

      <button class="generate-btn" id="generate-btn">Generate Kingdom</button>
      <button class="generate-btn veto-start-btn" id="veto-btn">Start Veto</button>
      <button class="sort-btn" id="sort-btn">Sort: By Cost</button>
      <div id="first-player-banner" class="first-player-banner" hidden></div>
    </aside>

    <!-- Main: kingdom display -->
    <main class="main">
<div class="supply-grid" id="supply-grid"></div>
      <div class="kingdom-grid" id="kingdom-grid"></div>
      <p class="empty-state" id="empty-state" hidden>No cards to show. Select a set and generate a kingdom.</p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
